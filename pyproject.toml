[project]
name = "mail-guard"
version = "0.1.0"
description = "智慧郵件防護系統"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
    "transformers>=4.45,<6",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
